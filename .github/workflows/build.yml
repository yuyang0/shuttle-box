name: build

# Builds the image on GitHub's runners and pushes it to GitHub Container Registry.
# No build proxy and no apt mirror are needed there: archive.ubuntu.com, the Mozilla
# repo and the shuttle release are all reachable directly, so the APT_MIRROR and
# *_PROXY build args stay empty and the Dockerfile uses its defaults.

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, to pick up base-image and apt updates even without a code change.
    - cron: "0 3 * * 1"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            # The git tag verbatim, so any tag name maps to an image tag of the
            # same name; the semver rules below add the v-less forms as well.
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            # latest tracks main only: a tag build must not move it.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          docker pull "$image"
          docker run --rm --entrypoint shuttle "$image" --version
          docker run --rm --entrypoint firefox "$image" --version 2>/dev/null || true
